# by  Mikhaeris based on simla33's work 
# https://github.com/InioX/matugen-themes/pull/88

# : Manager [[[

[mgr]
cwd = { fg = "#f1dedc" }

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#f9bc43", bg = "#f9bc43" }
marker_cut = { fg = "#fcdfa6", bg = "#fcdfa6" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#dfc38c", bg = "#dfc38c" }

# Count
count_copied = { fg = "#261a00", bg = "#fcdfa6" }
count_cut = { fg = "#261a00", bg = "#fcdfa6" }
count_selected = { fg = "#561e18", bg = "#dfc38c" }

# Border
border_symbol = "│"
border_style = { fg = "#ffb4a9" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active = { fg = "#ffb4a9", bold = true, bg = "#1a1110" }
inactive = { fg = "#e7bdb7", bg = "#1a1110" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#ffb4a9", fg = "#561e18", bold = true }
normal_alt = { bg = "#534341", fg = "#d8c2be" }

# Select mode
select_main = { bg = "#e7bdb7", fg = "#442926", bold = true }
select_alt = { bg = "#534341", fg = "#d8c2be" }

# Unset mode
unset_main = { bg = "#dfc38c", fg = "#3e2e04", bold = true }
unset_alt = { bg = "#534341", fg = "#d8c2be" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type = { fg = "#c15444" }
perm_write = { fg = "#a47c2e" }
perm_read = { fg = "#ff2b12" }
perm_exec = { fg = "#f7aa12" }
perm_sep = { fg = "#ff533c" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#ffb4a9", bg = "#423735" }
progress_error = { fg = "#ffb4ab", bg = "#423735" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#423735" }
cand = { fg = "#ffb4a9" }
rest = { fg = "#561e18" }
desc = { fg = "#f1dedc" }
separator = " ▶ "
separator_style = { fg = "#f1dedc" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#dfc38c" }
title_warn = { fg = "#ffb4a9" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#ffb4a9" }
active = { fg = "#dfc38c", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb4a9" }
value = { fg = "#f1dedc" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffb4a9", bg = "#561e18" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#ffb4a9" }
title = {}
hovered = { fg = "#fcdfa6", underline = true }

# : ]]]


# : Help [[[

[help]
on = { fg = "#f1dedc" }
run = { fg = "#f1dedc" }
footer = { fg = "#442926", bg = "#e7bdb7" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#94e2d5" },

  # Media
  { mime = "{audio,video}/*", fg = "#f9e2af" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

  # Special files
  { name = "*", is = "orphan", bg = "#93000a" },
  { name = "*", is = "exec", fg = "#ffdad6" },

  # Fallback
  { url = "*", fg = "#f1dedc" },
  { url = "*/", fg = "#ffb4a9" },
]

# : ]]]
